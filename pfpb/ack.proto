syntax = "proto3";

package platform;

option go_package = "github.com/gogu-x/gogs/pb/pfpb/pb_pf";

import "pfpb/struct.proto";

message AuthAck {
  int32 code  = 1;
  uint64  uid   = 3;
  string  token = 4;
  uint32   server_id = 5;
}

message VerifyAck {
  bool   valid = 1;
  uint64 uid   = 2;
  int32 code = 3;
}

message ServerListAck {
  int32                 code     = 1;
  repeated ServerAccount accounts = 3;
}

message OrderAck {
  int32 code     = 1;
  string  order_id = 3;
}

// ─── Deliver（平台服 → game NATS 通知）────────────────────────────────────────
message DeliverNotify {
  uint64 uid        = 1;
  string order_id   = 2;
  string product_id = 3;
  string server_id  = 4;
}
