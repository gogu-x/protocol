syntax = "proto3";

package platform;

option go_package = "github.com/gogu-x/gogs/pb/pfpb/pb_pf";

enum OrderStatus {
  PENDING   = 0;
  PAID      = 1;
  DELIVERED = 2;
  FAILED    = 3;
}

message ServerAccount {
  uint32  server_id = 1;
  uint64 uid       = 2;
}

message OrderDetail {
  string      order_id   = 1;
  uint64      uid        = 2;
  string      product_id = 3;
  string      server_id  = 4;
  OrderStatus status     = 5;
  int32 code = 6;
}
