syntax = "proto3";

package platform;

option go_package = "github.com/gogu-x/gogs/pb/pfpb/pb_pf";

// ─── Auth ────────────────────────────────────────────────────────────────────
message RegisterReq {
  string account   = 1;
  string password  = 2;
  uint32  server_id = 3;
}

message AuthLoginReq {
  string account   = 1;
  string password  = 2;
  uint32  server_id = 3;
}

message VerifyTokenReq {
  string token = 1;
}

// GetServerListReq is used before login to look up all registrations for an account.
message GetServerListReq {
  string account = 1;
}

// ─── Order ───────────────────────────────────────────────────────────────────
message CreateOrderReq {
  uint64 uid        = 1;
  string product_id = 2;
  string server_id  = 3;
}

message QueryOrderReq {
  string order_id = 1;
}
