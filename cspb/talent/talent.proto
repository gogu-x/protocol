syntax = "proto3";
option go_package = "github.com/gogu-x/gogs/pb/cspb/pb_talent";
import "cspb/common/growth.proto";
import "cspb/comm/error.proto";
message TalentNodeDefinition {
  int32 node_id = 1;
  int32 parent_id = 2;
  string name = 3;
  string effect = 4;
  GrowthBonuses bonuses = 5;
  int32 branch_id = 6;
  int32 ui_index = 7;
  int32 point_cost = 8;
  bool is_root = 9;
  string icon_key = 10;
}
message TalentBranchDefinition {
  int32 branch_id = 1;
  string name = 2;
  string icon_key = 3;
}
message RoleTalentData {
  uint64 revision = 1;
  int32 earned_points = 2;
  int32 spent_points = 3;
  int32 available_points = 4;
  repeated int32 learned_node_ids = 5;
  repeated TalentNodeDefinition nodes = 6;
  GrowthBonuses bonuses = 7;
  string role_id = 8;
  repeated TalentBranchDefinition branches = 9;
}
message GetRoleTalentReq { uint64 request_id = 1; }
message LearnRoleTalentReq { uint64 request_id = 1; uint64 expected_revision = 2; int32 node_id = 3; }
// 分支 -1 重置全部；0 到 3 重置指定分支，免费根节点始终保留。
message ResetRoleTalentReq { uint64 request_id = 1; uint64 expected_revision = 2; int32 branch = 3; }
message GetRoleTalentAck { uint64 request_id = 1; RoleTalentData data = 2; optional ErrCode code = 4; }
message LearnRoleTalentAck { uint64 request_id = 1; RoleTalentData data = 2; optional ErrCode code = 4; }
message ResetRoleTalentAck { uint64 request_id = 1; RoleTalentData data = 2; optional ErrCode code = 4; }
