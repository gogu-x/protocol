syntax = "proto3";

option go_package = "github.com/gogu-x/gogs/pb/cspb/pb_talent";

import "cspb/common/error.proto";
import "cspb/talent/struct.proto";

// 查询角色天赋响应
message GetRoleTalentAck {
  // 请求流水号
  uint64 request_id = 1;
  // 角色天赋数据
  RoleTalentData data = 2;
  // 请求处理结果
  ErrCode code = 4;
}

// 学习角色天赋响应
message LearnRoleTalentAck {
  // 请求流水号
  uint64 request_id = 1;
  // 角色天赋数据
  RoleTalentData data = 2;
  // 请求处理结果
  ErrCode code = 4;
}

// 重置角色天赋响应
message ResetRoleTalentAck {
  // 请求流水号
  uint64 request_id = 1;
  // 角色天赋数据
  RoleTalentData data = 2;
  // 请求处理结果
  ErrCode code = 4;
}
