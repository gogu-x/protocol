syntax = "proto3";

option go_package = "github.com/gogu-x/gogs/pb/cspb/pb_activity";

// 活动状态
enum ActivityStatus {
  // 未开始
  NOT_STARTED = 0;
  // 进行中
  ONGOING = 1;
  // 已结束
  ENDED = 2;
}

// 活动信息
message ActivityInfo {
  // 活动编号
  uint64 id = 1;
  // 活动名称
  string name = 2;
  // 活动状态
  ActivityStatus status = 3;
  // 活动开始时间戳
  int64 start_time = 4;
  // 活动结束时间戳
  int64 end_time = 5;
}

// 玩家活动进度
message ActivityProgress {
  // 活动编号
  uint64 activity_id = 1;
  // 玩家编号
  uint64 uid = 2;
  // 当前进度值
  int32 progress = 3;
  // 目标进度值
  int32 target = 4;
  // 奖励是否已领取
  bool rewarded = 5;
}
