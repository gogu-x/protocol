syntax = "proto3";

option go_package = "github.com/gogu-x/gogs/pb/cspb/pb_activity";

// 获取活动列表请求
message GetActivityListReq {}

// 参与活动请求
message JoinActivityReq {
  // 目标活动编号
  uint64 activity_id = 1;
}

// 查询活动进度请求
message GetProgressReq {
  // 目标活动编号
  uint64 activity_id = 1;
}

// 领取活动奖励请求
message ClaimRewardReq {
  // 目标活动编号
  uint64 activity_id = 1;
}
