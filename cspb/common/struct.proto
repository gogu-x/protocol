syntax = "proto3";

option go_package = "github.com/gogu-x/gogs/pb/cspb/pb_common";

// 普通资源余额。
message AssetBalance {
  // 资源编号。
  uint64 id = 1;
  // 资源数量。
  int64 count = 2;
}

// 成长属性加成；100 表示提升 10%
message GrowthBonuses {
  // 生命千分比加成
  int32 max_hp_permille = 1;
  // 攻击千分比加成
  int32 attack_permille = 2;
  // 防御千分比加成
  int32 defense_permille = 3;
  // 速度千分比加成
  int32 speed_permille = 4;
}

// 角色权威战斗属性
message RoleCombatStatsData {
  // 角色实例编号
  string role_id = 1;
  // 最大生命值
  int64 max_hp = 2;
  // 攻击值
  int64 attack = 3;
  // 防御值
  int64 defense = 4;
  // 速度值
  int64 speed = 5;
}

// 公共请求头
message comm {
  // 玩家编号
  uint64 uID = 1;
  // 服务器编号
  uint32 serverID = 2;
  // 会话编号
  string sessionID = 3;
}

// 类型、编号和值组合结构
message TypIDVal {
  // 类型标识
  string typ = 1;
  // 配置编号
  int32 id = 2;
  // 数值
  int64 val = 3;
  // 附加参数
  int32 pro = 4;
}
