syntax = "proto3";

option go_package = "github.com/gogu-x/gogs/pb/cspb/pb_battle";

import "cspb/battle/struct.proto";
import "cspb/common/error.proto";

// 战斗创建响应，战斗编号可能需要等待创建通知才能确定
message StartBattleAck {
  // 战斗编号
  string battle_id = 1;
  // 请求处理结果
  ErrCode code = 3;
}

// 战斗创建成功通知
message BattleCreatedNtf {
  // 战斗编号
  string battle_id = 1;
  // 玩家编号
  uint64 uid = 2;
  reserved 3;
  reserved "tick_duration_ms";
  // 参战单位名单。战斗创建时即已确定，随创建通知一并下发，
  // 客户端可在进入战斗页的第一时间就把双方单位摆好，而不是等某个单位先行动
  repeated BattleUnitResult units = 4;
  repeated BattleControl controls = 5;
  // 快照已包含的最后事件序号和当前战斗毫秒。
  uint64 snapshot_sequence = 6;
  int64 current_ms = 7;
  // 中途加入或重同步时仍然生效的状态。
  repeated BattleStatusView statuses = 8;
}

// 一条战斗事件推送
message BattleActionNtf {
  // 战斗编号
  string battle_id = 1;
  // 玩家编号
  uint64 uid = 2;
  // 战斗事件
  BattleEvent event = 3;
}

// 已完成的战斗结果
message BattleFinishedNtf {
  // 战斗编号
  string battle_id = 1;
  // 玩家编号
  uint64 uid = 2;
  // 战斗结算结果
  BattleOutcome outcome = 3;
  // 参战单位结果列表
  repeated BattleUnitResult units = 4;
  // 战斗结果校验值
  string checksum = 5;
  // 战斗类型，游戏服按爬塔、副本、首领等类型分发结算奖励，
  // 仅凭结算结果和单位状态无法确定业务类型
  BattleType battle_type = 6;
}

// 游戏服已处理战斗结算结果的确认通知
message BattleResultConfirmedNtf {
  // 战斗编号
  string battle_id = 1;
  // 玩家编号
  uint64 uid = 2;
}

// 每次玩家输入的权威回执。
message BattleInputAck {
  string battle_id = 1;
  string unit_id = 2;
  uint64 sequence = 3;
  ErrCode code = 4;
  uint64 action = 5;
  int64 ready_ms = 6;
  uint64 uid = 8;
  int64 current_ms = 9;
}

// 创建或加入战斗的异步失败结果。
message BattleAdmissionFailedNtf {
  string battle_id = 1;
  uint64 uid = 2;
  ErrCode code = 3;

}

// 快照中的状态实例，按实例编号和版本与后续事件衔接。
message BattleStatusView {
  string unit_id = 1;
  string status_id = 2;
  uint64 instance_id = 3;
  uint64 version = 4;
  int64 expire_ms = 5;
  int32 remaining_turns = 6;
  string source_id = 7;
}

// 领取结果；成功时按增益事件更新战斗画面。
message ClaimBattleGrantAck {
  string battle_id = 1;
  string unit_id = 2;
  string grant_id = 3;
  ErrCode code = 4;
}
