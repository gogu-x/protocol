syntax = "proto3";

option go_package = "github.com/gogu-x/gogs/pb/cspb/pb_actv";

// 活动状态。
enum ActvStatus {
  // 未开始。
  NOT_STARTED = 0;
  // 进行中。
  ONGOING = 1;
  // 已结束。
  ENDED = 2;
}

// 活动信息。
message ActvInfo {
  // 活动实例编号。
  uint64 id = 1;
  // 活动状态。
  ActvStatus status = 2;
  // 活动开始时间戳。
  int64 startTime = 3;
  // 活动结束时间戳。
  int64 endTime = 4;
  // 活动配置表 ID。
  int32 cfgId = 5;
  // 活动模板类型。
  int32 templateType = 6;
  // 活动归属类型。
  ActvOwnerScope ownerScope = 7;
  // 归属对象编号，根据 ownerScope 表示玩家、服务器或联盟编号。
  uint64 ownerId = 8;
  // 业务目标是否完成，由具体模板填充。
  bool completed = 9;
}

// 玩家活动进度。
message ActvProgress {
  // 活动实例编号。
  uint64 actvId = 1;
  // 此进度所属的玩家编号，不是活动实例编号。
  uint64 uid = 2;
  // 当前进度值。
  int32 progress = 3;
  // 目标进度值。
  int32 target = 4;
  // 奖励是否已领取。
  bool rewarded = 5;
}

// 活动实例归属范围。
enum ActvOwnerScope {
  // 未指定归属。
  ACTV_OWNER_UNSPECIFIED = 0;
  // 玩家归属。
  ACTV_OWNER_PLAYER = 1;
  // 服务器归属。
  ACTV_OWNER_SERVER = 2;
  // 联盟归属。
  ACTV_OWNER_GUILD = 3;
}

// 七日登录的个人状态。
message SevenDayLoginData {
  // 活动实例编号。
  uint64 actvId = 1;
  // 累计有效登录天数，最多七天。
  int32 loginDays = 2;
  // 当天有效登录次数，最多一次。
  int32 todayLoginCount = 3;
  // 服务器时区下次零点的 Unix 秒。
  int64 nextResetTime = 4;
  // 是否已累计登录七天。
  bool completed = 5;
}

// 活动任务状态。
message ActvTaskState {
  // 任务配置编号。
  int32 taskId = 1;
  // 当前进度。
  int64 progress = 2;
  // 完成目标。
  int64 target = 3;
  // 状态：0进行中、1待领取、2已领取。
  int32 status = 4;
}

// 兑换商品状态。
message ActvGoodsState {
  // 商品配置编号。
  int32 goodsId = 1;
  // 当前限购周期已购份数。
  int64 bought = 2;
}

// 抽奖及兑换的奖励结果。
message ActvRewardItem {
  // 类型：1普通资源、2装备。
  int32 rewardType = 1;
  // 奖励配置编号。
  int32 rewardId = 2;
  // 奖励数量。
  int64 count = 3;
}

// 任务抽奖活动自身的个人状态。
message TaskLotteryState {
  // 活动实例编号。
  uint64 actvId = 1;
  // 任务状态。
  repeated ActvTaskState tasks = 2;
  // 下一笔本活动写请求序号。
  uint64 nextSequence = 3;
  // 待完成的道具交易数量。
  int32 pendingRewards = 4;
  // 下次本地零点。
  int64 nextResetTime = 5;
}

// 独立个人商店状态。
message ActvShopState {
  // 商店实例编号。
  uint64 actvId = 1;
  // 商品限购状态。
  repeated ActvGoodsState goods = 3;
  // 下一笔商店交易序号，与其他活动独立。
  uint64 nextSequence = 4;
  // 下一次当地零点。
  int64 nextResetTime = 5;
  // 是否存在正在处理的交易。
  bool pending = 6;
}
