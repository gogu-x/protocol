syntax = "proto3";

option go_package = "github.com/gogu-x/gogs/pb/cspb/pb_guild";

// 公会职位
enum GuildRole {
  // 普通成员
  MEMBER = 0;
  // 副会长
  OFFICER = 1;
  // 会长
  LEADER = 2;
}

// 公会成员快照
message GuildMember {
  // 成员编号
  uint64 uid = 1;
  // 成员名称
  string name = 2;
  // 成员等级
  uint32 level = 3;
  // 成员职位
  GuildRole role = 4;
}

// 公会信息
message GuildInfo {
  // 公会编号
  uint64 guild_id = 1;
  // 公会名称
  string name = 2;
  // 公会公告
  string notice = 3;
  // 会长编号
  uint64 leader = 4;
  // 成员列表
  repeated GuildMember members = 5;
}
