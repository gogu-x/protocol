syntax = "proto3";

option go_package = "github.com/gogu-x/gogs/pb/cspb/pb_guild";

// 创建公会请求
message CreateGuildReq {
  // 公会名称
  string name = 2;
  // 会长名称
  string leader_name = 3;
  // 会长等级
  uint32 leader_level = 4;
}

// 加入公会请求
message JoinGuildReq {
  // 目标公会编号
  uint64 guild_id = 2;
  // 申请成员名称
  string member_name = 3;
  // 申请成员等级
  uint32 member_level = 4;
}

// 离开公会请求
message LeaveGuildReq {
}

// 查询公会信息请求
message GetGuildReq {
  // 目标公会编号
  uint64 guild_id = 1;
}
