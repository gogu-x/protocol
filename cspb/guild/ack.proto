syntax = "proto3";

option go_package = "github.com/gogu-x/gogs/pb/cspb/pb_guild";

import "cspb/guild/struct.proto";
import "cspb/comm/error.proto";

message CreateGuildAck {
  ErrCode   code  = 1;
  GuildInfo guild = 3;
}

message JoinGuildAck {
  ErrCode code = 1;
}

message LeaveGuildAck {
  ErrCode code = 1;
}

message GetGuildAck {
  ErrCode   code  = 1;
  GuildInfo guild = 2;
}
