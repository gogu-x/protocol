syntax = "proto3";

option go_package = "github.com/gogu-x/gogs/pb/cspb/pb_common";

enum ErrCode {
    OK = 0;

    UNKNOWN = -1;
    PARAM   = -2;

    UNAUTHORIZED      = -1001;
    LOGIN_IN_PROGRESS = -1002;
    SERVER_NOT_FOUND  = -1003;

    USERNAME_EXISTS  = -2001;
    WRONG_PASSWORD   = -2002;
    INTERNAL         = -2003;
    ACCOUNT_NOT_FOUND = -2004; // Account is not registered.

    GUILD_EXISTS     = -3001;
    GUILD_NOT_FOUND  = -3002;
    ALREADY_IN_GUILD = -3003;
    NOT_IN_GUILD     = -3004;

    LOADOUT_UNAVAILABLE = -4001; // Player progression state is unavailable.
    CONFIG_UNAVAILABLE = -4002; // Required configuration is unavailable.
    STALE_REVISION = -4003; // Request does not match the current revision.
    INVALID_SLOT = -4004; // Slot is not configured.
    ITEM_NOT_OWNED = -4005; // Item does not belong to the player.
    INVALID_ITEM_STATE = -4006; // Stored item state is invalid.

    EQUIPMENT_UNAVAILABLE = -4101; // Equipment state is unavailable.
    INVALID_EQUIPMENT = -4102; // Equipment cannot be used in this slot.

    DUPLICATE_JADE = -4201; // This soul jade configuration is already equipped.
    MAX_LEVEL_REACHED = -4202; // Item has reached its configured maximum level.
    INSUFFICIENT_ESSENCE = -4203; // Soul jade material balance is insufficient.
    AFFIX_GENERATION_FAILED = -4204; // Configured affixes could not be generated.

    INVALID_TALENT_NODE = -4301; // Talent node is not configured.
    TALENT_ALREADY_LEARNED = -4302; // Talent node is already learned.
    TALENT_PREREQUISITE_MISSING = -4303; // Talent prerequisite has not been learned.
    INSUFFICIENT_TALENT_POINTS = -4304; // Available talent points are insufficient.
    INVALID_TALENT_BRANCH = -4305; // Talent branch is not configured.

    BATTLE_UNAVAILABLE = -5001; // Battle service is unavailable.
    BATTLE_TIMEOUT = -5002; // Battle creation did not finish before the deadline.
    BATTLE_CREATE_FAILED = -5003; // Battle creation failed.
    INVALID_BATTLE_REQUEST = -5004; // Battle request is invalid.
    BATTLE_IN_PROGRESS = -5005; // A battle is already being created or played.

    ACTIVITY_UNAVAILABLE = -6001; // Activity service or operation is unavailable.
    ACTIVITY_NOT_FOUND = -6002; // Activity does not exist.
    ACTIVITY_NOT_OPEN = -6003; // Activity is not open.
    ACTIVITY_NOT_JOINED = -6004; // Player has not joined the activity.
    ACTIVITY_ALREADY_JOINED = -6005; // Player has already joined the activity.
    ACTIVITY_REWARD_NOT_READY = -6006; // Activity reward conditions are not met.
    ACTIVITY_REWARD_ALREADY_CLAIMED = -6007; // Activity reward has already been claimed.
}
