syntax = "proto3";

option go_package = "github.com/gogu-x/gogs/pb/cspb/pb_gateway";

// 切换目标服务器消息
message SwitchMsg {
  // 旧服务器标识
  string server_id = 1;
  // 新目标地址
  string new_addr = 2;
}

// 转发到游戏服的消息帧
message StreamMsg {
  // 待转发的消息帧
  Frame frame = 1;
}

// 延迟确认节点下线消息
message CheckDeleteMsg {
  // 服务器标识
  string server_id = 1;
  // 节点标识
  string node_id = 2;
}

// 连接注册消息
message ConnRegMsg {
  // 连接编号
  uint64 conn_id = 1;
}

// 连接注销消息
message ConnUnregMsg {
  // 连接编号
  uint64 conn_id = 1;
}

// 广播消息
message BroadcastMsg {
  // 广播载荷
  bytes data = 1;
}

// 网关与游戏服之间的通用消息帧
message Frame {
  // 消息载荷
  bytes payload = 1;
}

// 服务器账号信息
message ServerAccount {
  // 服务器编号
  uint32 server_id = 1;
  // 玩家编号
  uint64 uid = 2;
}
