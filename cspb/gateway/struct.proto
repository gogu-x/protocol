syntax = "proto3";

option go_package = "github.com/gogu-x/gogs/pb/cspb/pb_gateway";

// 网关与游戏服之间的通用消息帧
message Frame {
  // 消息载荷
  bytes payload = 1;
}

// 服务器账号信息
message ServerAccount {
  // 服务器编号
  uint32 server_id = 1;
  // 玩家编号
  uint64 uid = 2;
}

// 网关流式传输服务
service Gateway {
  // 双向流式转发消息帧
  rpc Stream(stream Frame) returns (stream Frame);
}
